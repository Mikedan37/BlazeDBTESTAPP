# Minimal build: validates the harness still compiles against BlazeDB main.
# Sibling layout matches Xcode local path: ../BlazeDB

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout BlazeDBTESTAPP
        uses: actions/checkout@v4
        with:
          path: BlazeDBTESTAPP

      - name: Checkout BlazeDB (sibling for local SwiftPM)
        uses: actions/checkout@v4
        with:
          repository: Mikedan37/BlazeDB
          path: BlazeDB

      # GitHub-hosted macOS runners have no Apple dev certs; compile-only, no signing.
      # Deployment target in the project must be ≤ runner SDK (see MACOSX_DEPLOYMENT_TARGET).
      - name: Build
        run: >
          xcodebuild
          -scheme BlazeDBTESTAPP
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
        working-directory: BlazeDBTESTAPP
